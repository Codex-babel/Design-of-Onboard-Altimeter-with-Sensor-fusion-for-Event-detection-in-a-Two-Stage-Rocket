[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketfusion"
version = "0.1.0"
description = "Virtual rocket/sensor simulator and benchmark for onboard state-transition detection with multisensor fusion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["rocketfusion*"]
